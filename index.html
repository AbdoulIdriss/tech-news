<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechFind – your tech radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa;--surface:#fff;--ink:#0e1629;--muted:#5d6a85;--line:#e1e6f0;--accent:#4338ff;--accent-d:#2f25d6;--shadow:0 1px 2px rgba(14,22,41,.04),0 8px 24px -12px rgba(14,22,41,.18);
  --c-programming:#4338ff;--c-mobile:#0a8da8;--c-apps:#d6246e;--c-ai:#9333ea;--c-innovation:#e2610c;
  --hn:#e2610c;--gh:#24292f;--dev:#0f8f6a;
  --display:'Sora',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1e;--surface:#121a30;--ink:#e8edf9;--muted:#93a1c0;--line:#222d4b;--accent:#6c73ff;--accent-d:#8a90ff;--gh:#c9d1d9;--shadow:0 8px 24px -12px rgba(0,0,0,.6);
  --c-programming:#8b92ff;--c-mobile:#35c3df;--c-apps:#ff6aa8;--c-ai:#c084fc;--c-innovation:#ff9a54}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--display);letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button{font:600 .82rem var(--body);border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:7px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{padding:34px 0 22px}
h1{font:700 clamp(2rem,5.5vw,3.3rem)/1.08 var(--display);letter-spacing:-.035em;margin:0 0 12px;max-width:16ch}
.sub{color:var(--muted);margin:0 0 26px;max-width:52ch;font-size:1.05rem}
.bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 18px;box-shadow:var(--shadow)}
.bar:focus-within{border-color:var(--accent)}
.bar svg{flex:none;width:20px;height:20px;color:var(--muted)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:500 1.05rem var(--body);padding:10px 0}
.bar input::placeholder{color:var(--muted);font-weight:400}
.go{flex:none;display:flex;align-items:center;gap:10px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 1rem var(--display);padding:13px 24px;cursor:pointer}
.go:hover{background:var(--accent-d)}
.go:disabled{cursor:progress;opacity:.85}
.go .sp{display:none;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.go.busy .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.row .lbl{color:var(--muted);font-size:.9rem;margin-right:4px}
.topic{font:500 .9rem var(--body);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.topic:hover{border-color:var(--accent);color:var(--accent)}
.chip{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted);margin-right:10px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.ok i{background:#16a34a}.chip.load i{background:#f2a900;animation:pulse 1s infinite}.chip.err i{background:#dc2626}
@keyframes pulse{50%{opacity:.3}}
.tabsbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;display:flex;align-items:center;gap:8px;font:600 .95rem var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--tc,var(--accent))}
.tabs i{width:9px;height:9px;border-radius:3px;background:var(--tc,var(--muted))}
.tabs em{font-style:normal;font-size:.78rem;background:var(--line);color:var(--muted);padding:1px 7px;border-radius:999px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 14px}
.head h2{font:600 1.15rem var(--display);margin:0;letter-spacing:-.01em}
.head span{color:var(--muted);font-size:.88rem}
ul{list-style:none;margin:0;padding:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:70px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card.feat{grid-column:1/-1;padding:26px 28px}
.card.feat .title{font-size:clamp(1.4rem,3.2vw,1.9rem);line-height:1.2}
.card.feat p{font-size:1.05rem;-webkit-line-clamp:3}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.tag{font:600 .78rem var(--body);color:var(--t);background:color-mix(in srgb,var(--t) 12%,transparent);padding:3px 10px;border-radius:6px}
.src{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--s)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--s)}
.title{font:600 1.08rem/1.32 var(--display);letter-spacing:-.015em;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.title::after{content:"";position:absolute;inset:0;border-radius:16px}
.card p{margin:8px 0 0;color:var(--muted);font-size:.94rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:14px;font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 14px}
.meta b{color:var(--ink);font-weight:600}
.sk{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%);background-size:300% 100%;animation:sh 1.3s infinite}
.sk:first-child{grid-column:1/-1;height:190px}
@keyframes sh{to{background-position:-100% 0}}
.msg{grid-column:1/-1;text-align:center;padding:50px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.msg strong{display:block;font:600 1.2rem var(--display);color:var(--ink);margin-bottom:6px}
.msg button{margin-top:14px}
@media (max-width:720px){.grid{grid-template-columns:1fr}.go span.t{display:none}.go{padding:13px 16px}.hero{padding-top:18px}.card.feat{padding:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><circle cx="16" cy="16" r="9" stroke="#fff" stroke-opacity=".45" stroke-width="2"/><circle cx="16" cy="16" r="4" stroke="#fff" stroke-width="2"/><path d="M16 16 24 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      TechFind
    </span>
    <div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">EN</button><button data-l="fr" aria-pressed="false">FR</button></div>
  </nav>

  <section class="hero">
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" aria-label="Search">
      <button class="go" id="go"><span class="t" id="goTxt"></span><span class="sp" aria-hidden="true"></span></button>
    </div>
    <div class="row" id="topics"></div>
    <div class="row" id="status" aria-live="polite"></div>
  </section>
</div>

<div class="tabsbar"><div class="wrap"><div class="tabs" id="tabs" role="group"></div></div></div>

<main class="wrap">
  <div class="head"><h2 id="title"></h2><span id="count"></span></div>
  <ul class="grid" id="list"></ul>
</main>

<script>
const T={
 en:{h1:"Your daily tech radar.",sub:"Find what's new in programming, mobile, AI and innovation. Pulled live from Hacker News, GitHub and Dev.to.",
  ph:"Search a topic, or leave empty for the latest…",find:"Find",busy:"Searching",topics:"Try",
  cats:{all:"All",mobile:"Mobile dev",programming:"Programming",ai:"AI",apps:"Apps",innovation:"Innovation"},
  latest:"Latest across the web",results:q=>"Results for “"+q+"”",n:n=>n+(n==1?" story":" stories"),
  noT:"Nothing in this category yet",noB:"Try another category, or search a specific topic.",
  errT:"Couldn't reach any source",errB:"Open this file from your own website or by double-clicking it (not inside a preview window), check your connection, then try again.",retry:"Try again",
  pts:"points",com:"comments",stars:"stars",react:"reactions",fail:"unavailable",updated:"Updated",
  ago:(v,u)=>v+u+" ago",u:{m:"m",h:"h",d:"d"}},
 fr:{h1:"Votre radar tech au quotidien.",sub:"Découvrez les nouveautés en programmation, mobile, IA et innovation. Tiré en direct de Hacker News, GitHub et Dev.to.",
  ph:"Cherchez un sujet, ou laissez vide pour les dernières actus…",find:"Trouver",busy:"Recherche",topics:"Essayez",
  cats:{all:"Tout",mobile:"Mobile",programming:"Programmation",ai:"IA",apps:"Apps",innovation:"Innovation"},
  latest:"Les dernières actus du web",results:q=>"Résultats pour « "+q+" »",n:n=>n+(n==1?" article":" articles"),
  noT:"Rien dans cette catégorie",noB:"Essayez une autre catégorie ou cherchez un sujet précis.",
  errT:"Aucune source accessible",errB:"Ouvrez ce fichier depuis votre site ou en double-cliquant dessus (pas dans un aperçu), vérifiez votre connexion, puis réessayez.",retry:"Réessayer",
  pts:"points",com:"commentaires",stars:"étoiles",react:"réactions",fail:"indisponible",updated:"Mis à jour",
  ago:(v,u)=>"il y a "+v+" "+u,u:{m:"min",h:"h",d:"j"}}
};
const SRC={hn:"Hacker News",gh:"GitHub",dev:"Dev.to"};
const PRIORITY=["mobile","ai","programming","apps","innovation"];
const RX={
 mobile:/\b(flutter|dart|swift|swiftui|ios|android|kotlin|jetpack|react native|expo|xcode|mobile|iphone|ipad|cross-platform)\b/i,
 ai:/\b(ai|llms?|gpt|openai|anthropic|claude|gemini|machine learning|neural|agents?|diffusion|copilot|chatbots?|deepseek|mistral|rag)\b/i,
 programming:/\b(code|coding|programming|developers?|javascript|typescript|python|rust|golang|java|api|framework|react|vue|next\.?js|git|linux|database|sql|compiler|css|html|library|devops|docker|kubernetes|cli|npm|webdev)\b/i,
 apps:/\b(apps?|saas|extension|browser|pwa|app store|play store|software|platform|tool)\b/i,
 innovation:/(startup|quantum|robot|chips?|semiconductor|breakthrough|funding|raises|satellite|battery|hardware|launch|nasa|spacex|open.?source|research)/i
};
const TOPICS=["Flutter","SwiftUI","Kotlin","Rust","AI agents","Next.js"];
let lang=get("tf_lang")||"en",cat="all",items=[],when=null,lastQ="",loading=false,failed=false;
const $=id=>document.getElementById(id);
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
const guess=t=>Object.keys(RX).filter(k=>RX[k].test(t));
const since=d=>new Date(Date.now()-d*864e5).toISOString().slice(0,10);
const ago=ts=>{const s=(Date.now()-ts)/1000,t=T[lang];
  if(s<3600)return t.ago(Math.max(1,Math.round(s/60)),t.u.m);
  if(s<86400)return t.ago(Math.round(s/3600),t.u.h);
  return t.ago(Math.round(s/86400),t.u.d)};
async function getJSON(url){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(id)}
}
const uniq=a=>[...new Set(a)];

/* ---------- source adapters ---------- */
const hn=async(params,force=[])=>(await getJSON("https://hn.algolia.com/api/v1/search?"+params)).hits.filter(h=>h.title).map(h=>({
  src:"hn",title:h.title,url:h.url||"https://news.ycombinator.com/item?id="+h.objectID,desc:"",ts:h.created_at_i*1000,
  stat:[h.points+" {pts}",h.num_comments+" {com}"],cats:uniq([...force,...guess(h.title)])}));
const gh=async(q,force=[])=>(await getJSON("https://api.github.com/search/repositories?sort=stars&order=desc&per_page=20&q="+enc(q))).items.map(r=>({
  src:"gh",title:r.full_name,url:r.html_url,desc:r.description||"",ts:new Date(r.created_at).getTime(),
  stat:[r.stargazers_count.toLocaleString()+" {stars}",r.language||""].filter(Boolean),
  cats:uniq([...force,...guess(r.full_name+" "+(r.description||"")+" "+(r.topics||[]).join(" ")),"programming"])}));
const dev=async(params,force=[])=>(await getJSON("https://dev.to/api/articles?"+params)).map(a=>({
  src:"dev",title:a.title,url:a.url,desc:a.description||"",ts:new Date(a.published_timestamp).getTime(),
  stat:[a.public_reactions_count+" {react}",a.comments_count+" {com}"],
  cats:uniq([...force,...guess(a.title+" "+(a.tag_list||[]).join(" ")),"programming"])}));

function jobsFor(q){
  if(q){
    const j=[["hn",()=>hn("tags=story&hitsPerPage=25&query="+enc(q))],["gh",()=>gh(q+" in:name,description,topics")]];
    if(/^[\w.-]+$/.test(q))j.push(["dev",()=>dev("per_page=20&tag="+enc(q.toLowerCase().replace(/\./g,"")))]);
    return j;
  }
  return [
   ["hn",()=>hn("tags=front_page&hitsPerPage=30")],
   ["hn",()=>hn("tags=story&hitsPerPage=10&query=flutter&numericFilters="+enc("points>3"),["mobile"])],
   ["hn",()=>hn("tags=story&hitsPerPage=10&query=swift&numericFilters="+enc("points>10"),["mobile"])],
   ["gh",()=>gh("created:>"+since(7))],
   ["gh",()=>gh("topic:flutter created:>"+since(60),["mobile"])],
   ["gh",()=>gh("topic:swift created:>"+since(60),["mobile"])],
   ["dev",()=>dev("top=1&per_page=30")],
   ["dev",()=>dev("tag=flutter&top=14&per_page=8",["mobile"])],
   ["dev",()=>dev("tag=swift&top=14&per_page=8",["mobile"])],
   ["dev",()=>dev("tag=android&top=14&per_page=8",["mobile"])],
   ["dev",()=>dev("tag=ai&top=7&per_page=8",["ai"])]
  ];
}

async function find(){
  if(loading)return;
  const q=$("q").value.trim();lastQ=q;loading=true;failed=false;
  $("go").disabled=true;$("go").classList.add("busy");$("goTxt").textContent=T[lang].busy;
  const jobs=jobsFor(q),st={},ok={};
  jobs.forEach(([s])=>{st[s]="load";ok[s]=0});drawStatus(st);render();
  const res=await Promise.all(jobs.map(async([s,fn])=>{
    try{const r=await fn();ok[s]++;return r}catch(e){return[]}
  }));
  Object.keys(st).forEach(s=>st[s]=ok[s]?"ok":"err");drawStatus(st);
  // merge, dedupe by url, interleave so all sources appear near the top
  const by={hn:[],gh:[],dev:[]},seen=new Map();
  res.flat().forEach(i=>{const k=i.url.replace(/\/$/,"");
    if(seen.has(k)){const o=seen.get(k);o.cats=uniq([...o.cats,...i.cats]);return}
    seen.set(k,i);by[i.src].push(i)});
  const out=[],max=Math.max(...Object.values(by).map(a=>a.length));
  for(let n=0;n<max;n++)["hn","dev","gh"].forEach(s=>{if(by[s][n])out.push(by[s][n])});
  items=out;when=Date.now();failed=!out.length;loading=false;
  $("go").disabled=false;$("go").classList.remove("busy");$("goTxt").textContent=T[lang].find;
  render();
}

/* ---------- rendering ---------- */
function drawStatus(st){
  $("status").innerHTML=Object.keys(st).map(k=>`<span class="chip ${st[k]}"><i></i>${SRC[k]}${st[k]=="err"?" · "+T[lang].fail:""}</span>`).join("");
}
function drawTabs(){
  const t=T[lang];
  $("tabs").innerHTML=Object.keys(t.cats).map(k=>{
    const n=k=="all"?items.length:items.filter(i=>i.cats.includes(k)).length;
    return `<button data-c="${k}" aria-pressed="${k==cat}" style="--tc:var(--c-${k},var(--accent))"><i></i>${t.cats[k]}${items.length?`<em>${n}</em>`:""}</button>`}).join("");
}
function render(){
  const t=T[lang];
  drawTabs();
  $("title").textContent=lastQ?t.results(lastQ):t.latest;
  const rows=items.filter(i=>cat=="all"||i.cats.includes(cat));
  $("count").textContent=items.length?t.n(rows.length)+(when?" · "+t.updated+" "+new Date(when).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""):"";
  if(loading&&!items.length){$("list").innerHTML='<li class="sk"></li>'.repeat(5);return}
  if(failed){$("list").innerHTML=`<li class="msg"><strong>${t.errT}</strong>${t.errB}<br><button class="topic" onclick="find()">${t.retry}</button></li>`;return}
  if(!rows.length){$("list").innerHTML=`<li class="msg"><strong>${t.noT}</strong>${t.noB}</li>`;return}
  $("list").innerHTML=rows.map((i,n)=>{
    const tags=PRIORITY.filter(k=>i.cats.includes(k)).slice(0,2);
    return `<li class="card${n==0?" feat":""}" style="--s:var(--${i.src})">
      <div class="top">${tags.map(k=>`<span class="tag" style="--t:var(--c-${k})">${t.cats[k]}</span>`).join("")}<span class="src"><i></i>${SRC[i.src]}</span></div>
      <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>
      ${i.desc?`<p>${esc(i.desc)}</p>`:""}
      <div class="meta">${i.stat.map(s=>`<span>${esc(s.replace(/\{(\w+)\}/g,(m,k)=>t[k]))}</span>`).join("")}<span>${ago(i.ts)}</span></div></li>`}).join("");
}
function ui(){
  const t=T[lang];document.documentElement.lang=lang;
  $("h1").textContent=t.h1;$("sub").textContent=t.sub;$("q").placeholder=t.ph;
  if(!loading)$("goTxt").textContent=t.find;
  $("topics").innerHTML=`<span class="lbl">${t.topics}</span>`+TOPICS.map(x=>`<button class="topic">${x}</button>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lang));
  render();
}
$("go").onclick=find;
$("q").onkeydown=e=>{if(e.key==="Enter")find()};
$("topics").onclick=e=>{const b=e.target.closest(".topic");if(b){$("q").value=b.textContent;find()}};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
document.querySelector(".lang").onclick=e=>{const b=e.target.closest("button");if(b){lang=b.dataset.l;put("tf_lang",lang);ui()}};
ui();find();
</script>
</body>
</html>
