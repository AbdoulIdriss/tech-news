<style>
:root{
  --bg:#f3f5fa;--surface:#fff;--ink:#0e1629;--muted:#5d6a85;--line:#e1e6f0;--accent:#4338ff;--accent-d:#2f25d6;--shadow:0 1px 2px rgba(14,22,41,.04),0 8px 24px -12px rgba(14,22,41,.18);

}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1e;--surface:#121a30;--ink:#e8edf9;--muted:#93a1c0;--line:#222d4b;--accent:#6c73ff;--accent-d:#8a90ff;--gh:#c9d1d9;--shadow:0 8px 24px -12px rgba(0,0,0,.6);
  --c-programming:#8b92ff;--c-mobile:#35c3df;--c-apps:#ff6aa8;--c-ai:#c084fc;--c-innovation:#ff9a54}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--display);letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.lang,.modes{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button,.modes button{font:600 .82rem var(--body);border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:7px;cursor:pointer}
.lang button[aria-pressed=true],.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{padding:34px 0 22px}
h1{font:700 clamp(2rem,5.5vw,3.3rem)/1.08 var(--display);letter-spacing:-.035em;margin:0 0 12px;max-width:16ch}
.sub{color:var(--muted);margin:0 0 26px;max-width:52ch;font-size:1.05rem}
.bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 18px;box-shadow:var(--shadow)}
.bar:focus-within{border-color:var(--accent)}
.bar svg{flex:none;width:20px;height:20px;color:var(--muted)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:500 1.05rem var(--body);padding:10px 0}
.bar input::placeholder{color:var(--muted);font-weight:400}
.go{flex:none;display:flex;align-items:center;gap:10px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 1rem var(--display);padding:13px 24px;cursor:pointer}
.go:hover{background:var(--accent-d)}
.go:disabled{cursor:progress;opacity:.85}
.go .sp{display:none;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.go.busy .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.row .lbl{color:var(--muted);font-size:.9rem;margin-right:4px}
.topic{font:500 .9rem var(--body);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.topic:hover{border-color:var(--accent);color:var(--accent)}
.chip{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted);margin-right:10px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.ok i{background:#16a34a}.chip.load i{background:#f2a900;animation:pulse 1s infinite}.chip.err i{background:#dc2626}
@keyframes pulse{50%{opacity:.3}}
.tabsbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;display:flex;align-items:center;gap:8px;font:600 .95rem var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--tc,var(--accent))}
.tabs i{width:9px;height:9px;border-radius:3px;background:var(--tc,var(--muted))}
.tabs em{font-style:normal;font-size:.78rem;background:var(--line);color:var(--muted);padding:1px 7px;border-radius:999px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 14px}.head div span{display:block}
.head h2{font:600 1.15rem var(--display);margin:0;letter-spacing:-.01em}
.head span{color:var(--muted);font-size:.88rem}
ul{list-style:none;margin:0;padding:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:70px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card.feat{grid-column:1/-1;padding:26px 28px}
.card.feat .title{font-size:clamp(1.4rem,3.2vw,1.9rem);line-height:1.2}
.card.feat p{font-size:1.05rem;-webkit-line-clamp:3}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.tag{font:600 .78rem var(--body);color:var(--t);background:color-mix(in srgb,var(--t) 12%,transparent);padding:3px 10px;border-radius:6px}
.src{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--s)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--s)}
.title{font:600 1.08rem/1.32 var(--display);letter-spacing:-.015em;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.title::after{content:"";position:absolute;inset:0;border-radius:16px}
.card p{margin:8px 0 0;color:var(--muted);font-size:.94rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:14px;font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 14px}
.meta b{color:var(--ink);font-weight:600}
.sk{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%);background-size:300% 100%;animation:sh 1.3s infinite}
.sk:first-child{grid-column:1/-1;height:190px}
@keyframes sh{to{background-position:-100% 0}}
.msg{grid-column:1/-1;text-align:center;padding:50px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.msg strong{display:block;font:600 1.2rem var(--display);color:var(--ink);margin-bottom:6px}
.msg button{margin-top:14px}
.sort{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.sort button{font:600 .8rem var(--body);border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer}
.sort button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.read{margin-left:auto;color:var(--accent);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(800px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
body.open .scrim{opacity:1;pointer-events:auto}body.open .panel{transform:none}body.open{overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph .x{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.ph .pt{flex:1;min-width:0;font:600 .95rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .orig{flex:none;font:600 .85rem var(--body);color:#fff;background:var(--accent);text-decoration:none;padding:9px 14px;border-radius:10px}
.pb{flex:1;min-height:0;overflow:auto}
.pb iframe{display:block;width:100%;height:100%;border:0;background:var(--surface)}
.pb .msg{margin:24px}
.pb .sk{margin:24px;height:110px}
[hidden]{display:none!important}
.modes button{font-size:.92rem;padding:6px 16px}
:root{--rm:#0d8a8a;--jb:#7c3aed;--ro:#d9480f}
.topic[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go.big{font-size:1.15rem;padding:15px 28px;border-radius:14px}
.card p b{color:var(--ink);font-weight:600}
.credit{color:var(--muted);font-size:.85rem;padding-bottom:70px;margin-top:-50px}
@media (max-width:720px){.grid{grid-template-columns:1fr}.go span.t{display:none}.go{padding:13px 16px}.hero{padding-top:18px}.card.feat{padding:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
const T={
 en:{h1:"Your daily tech radar.",sub:"Find what's new in programming, mobile, AI and innovation. Read every story right here, no tab-hopping. Live from Hacker News, GitHub and Dev.to, last 5 months only.",
  ph:"Search a topic, or leave empty for the latest…",find:"Find",busy:"Searching",topics:"Try",
  cats:{all:"All",mobile:"Mobile dev",programming:"Programming",ai:"AI",apps:"Apps",innovation:"Innovation"},
  latest:"Latest across the web",win:"last 5 months",newest:"Newest",popular:"Popular",read:"Read here",nNews:"News",nJobs:"Jobs",jh1:"Junior Flutter & Angular jobs, remote.",jsub:"Entry-level remote positions open to candidates worldwide, gathered live from Remotive, Jobicy and RemoteOK.",jfind:"Find jobs",jlatest:"Junior remote jobs",jn:n=>n+(n==1?" job":" jobs"),jwin:"last 60 days",jall:"All stacks",jworld:"Open worldwide",jnoT:"No matching jobs right now",jnoB:"Junior roles are rare. Switch off “Open worldwide” or check again later.",jerrT:"Couldn't reach any job board",apply:"Apply",credit:"Listings from Remotive, Jobicy and RemoteOK. Each link goes to the original posting.",close:"Close",orig:"Open original",cantT:"This one can't be shown here",cantB:"The site doesn't allow reading inside other pages. You can still open the original.",results:q=>"Results for “"+q+"”",n:n=>n+(n==1?" story":" stories"),
  noT:"Nothing in this category yet",noB:"Try another category, or search a specific topic.",
  errT:"Couldn't reach any source",errB:"Open this file from your own website or by double-clicking it (not inside a preview window), check your connection, then try again.",retry:"Try again",
  pts:"points",com:"comments",stars:"stars",react:"reactions",fail:"unavailable",updated:"Updated",
  ago:(v,u)=>v+u+" ago",u:{m:"m",h:"h",d:"d"}},
 fr:{h1:"Votre radar tech au quotidien.",sub:"Découvrez les nouveautés en programmation, mobile, IA et innovation. Lisez chaque article ici, sans changer de page. En direct de Hacker News, GitHub et Dev.to, 5 derniers mois seulement.",
  ph:"Cherchez un sujet, ou laissez vide pour les dernières actus…",find:"Trouver",busy:"Recherche",topics:"Essayez",
  cats:{all:"Tout",mobile:"Mobile",programming:"Programmation",ai:"IA",apps:"Apps",innovation:"Innovation"},
  latest:"Les dernières actus du web",win:"5 derniers mois",newest:"Récents",popular:"Populaires",read:"Lire ici",nNews:"Actus",nJobs:"Emplois",jh1:"Emplois junior Flutter & Angular, en télétravail.",jsub:"Postes débutants en télétravail, ouverts aux candidats du monde entier, récupérés en direct sur Remotive, Jobicy et RemoteOK.",jfind:"Trouver des emplois",jlatest:"Emplois junior à distance",jn:n=>n+(n==1?" offre":" offres"),jwin:"60 derniers jours",jall:"Toutes les technos",jworld:"Ouvert au monde entier",jnoT:"Aucune offre pour l'instant",jnoB:"Les postes junior sont rares. Désactivez « Ouvert au monde entier » ou réessayez plus tard.",jerrT:"Aucun site d'emploi accessible",apply:"Postuler",credit:"Offres de Remotive, Jobicy et RemoteOK. Chaque lien mène à l'annonce d'origine.",close:"Fermer",orig:"Ouvrir l'original",cantT:"Impossible d'afficher cet article ici",cantB:"Le site interdit la lecture dans une autre page. Vous pouvez ouvrir l'original.",results:q=>"Résultats pour « "+q+" »",n:n=>n+(n==1?" article":" articles"),
  noT:"Rien dans cette catégorie",noB:"Essayez une autre catégorie ou cherchez un sujet précis.",
  errT:"Aucune source accessible",errB:"Ouvrez ce fichier depuis votre site ou en double-cliquant dessus (pas dans un aperçu), vérifiez votre connexion, puis réessayez.",retry:"Réessayer",
  pts:"points",com:"commentaires",stars:"étoiles",react:"réactions",fail:"indisponible",updated:"Mis à jour",
  ago:(v,u)=>"il y a "+v+" "+u,u:{m:"min",h:"h",d:"j"}}
};
const SRC={hn:"Hacker News",gh:"GitHub",dev:"Dev.to"};
const JSRC={rm:"Remotive",jb:"Jobicy",ro:"RemoteOK"};
const PRIORITY=["mobile","ai","programming","apps","innovation"];
const RX={
 mobile:/\b(flutter|dart|swift|swiftui|ios|android|kotlin|jetpack|react native|expo|xcode|mobile|iphone|ipad|cross-platform)\b/i,
 ai:/\b(ai|llms?|gpt|openai|anthropic|claude|gemini|machine learning|neural|agents?|diffusion|copilot|chatbots?|deepseek|mistral|rag)\b/i,
 programming:/\b(code|coding|programming|developers?|javascript|typescript|python|rust|golang|java|api|framework|react|vue|next\.?js|git|linux|database|sql|compiler|css|html|library|devops|docker|kubernetes|cli|npm|webdev)\b/i,
 apps:/\b(apps?|saas|extension|browser|pwa|app store|play store|software|platform|tool)\b/i,
 innovation:/(startup|quantum|robot|chips?|semiconductor|breakthrough|funding|raises|satellite|battery|hardware|launch|nasa|spacex|open.?source|research)/i
};
const TOPICS=["Flutter","SwiftUI","Kotlin","Rust","AI agents","Next.js"];
let lang=get("tf_lang")||"en",cat="all",items=[],when=null,lastQ="",loading=false,failed=false,view=[],sort="new",mode="news",jobs=[],jview=[],jstack="all",jworld=true,jloading=false,jfailed=false,jloaded=false,jwhen=null;
const $=id=>document.getElementById(id);
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
const guess=t=>Object.keys(RX).filter(k=>RX[k].test(t));
const since=d=>new Date(Date.now()-d*864e5).toISOString().slice(0,10);
const ago=ts=>{const s=(Date.now()-ts)/1000,t=T[lang];
  if(s<3600)return t.ago(Math.max(1,Math.round(s/60)),t.u.m);
  if(s<86400)return t.ago(Math.round(s/3600),t.u.h);
  return t.ago(Math.round(s/86400),t.u.d)};
async function getJSON(url){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(id)}
}
const uniq=a=>[...new Set(a)];

/* ---------- source adapters ---------- */
const MAXD=150,cutoff=()=>Date.now()-MAXD*864e5;            // 5 months
const hnFilter=pts=>enc("created_at_i>"+Math.floor(cutoff()/1000)+",points>"+pts);
const hn=async(params,force=[])=>(await getJSON("https://hn.algolia.com/api/v1/search?"+params)).hits.filter(h=>h.title).map(h=>({
  src:"hn",id:h.objectID,ext:h.url||"",title:h.title,url:h.url||"https://news.ycombinator.com/item?id="+h.objectID,desc:"",ts:h.created_at_i*1000,
  stat:[h.points+" {pts}",h.num_comments+" {com}"],cats:uniq([...force,...guess(h.title)])}));
const gh=async(q,force=[])=>(await getJSON("https://api.github.com/search/repositories?sort=stars&order=desc&per_page=20&q="+enc(q))).items.map(r=>({
  src:"gh",id:r.full_name,title:r.full_name,url:r.html_url,desc:r.description||"",ts:new Date(r.created_at).getTime(),
  stat:[r.stargazers_count.toLocaleString()+" {stars}",r.language||""].filter(Boolean),
  cats:uniq([...force,...guess(r.full_name+" "+(r.description||"")+" "+(r.topics||[]).join(" ")),"programming"])}));
const dev=async(params,force=[])=>(await getJSON("https://dev.to/api/articles?"+params)).map(a=>({
  src:"dev",id:a.id,title:a.title,url:a.url,desc:a.description||"",ts:new Date(a.published_timestamp).getTime(),
  stat:[a.public_reactions_count+" {react}",a.comments_count+" {com}"],
  cats:uniq([...force,...guess(a.title+" "+(a.tag_list||[]).join(" ")),"programming"])}));

function jobsFor(q){
  if(q){
    const j=[["hn",()=>hn("tags=story&hitsPerPage=30&query="+enc(q)+"&numericFilters="+hnFilter(2))],
             ["gh",()=>gh(q+" in:name,description,topics created:>"+since(MAXD))]];
    if(/^[\w.-]+$/.test(q))j.push(["dev",()=>dev("per_page=25&top="+MAXD+"&tag="+enc(q.toLowerCase().replace(/\./g,"")))]);
    return j;
  }
  return [
   ["hn",()=>hn("tags=front_page&hitsPerPage=30")],
   ["hn",()=>hn("tags=story&hitsPerPage=10&query=flutter&numericFilters="+hnFilter(3),["mobile"])],
   ["hn",()=>hn("tags=story&hitsPerPage=10&query=swift&numericFilters="+hnFilter(10),["mobile"])],
   ["gh",()=>gh("created:>"+since(14))],
   ["gh",()=>gh("topic:flutter created:>"+since(90),["mobile"])],
   ["gh",()=>gh("topic:swift created:>"+since(90),["mobile"])],
   ["dev",()=>dev("top=7&per_page=30")],
   ["dev",()=>dev("tag=flutter&top=30&per_page=8",["mobile"])],
   ["dev",()=>dev("tag=swift&top=30&per_page=8",["mobile"])],
   ["dev",()=>dev("tag=android&top=30&per_page=8",["mobile"])],
   ["dev",()=>dev("tag=ai&top=14&per_page=8",["ai"])]
  ];
}

async function find(){
  if(loading)return;
  const q=$("q").value.trim();lastQ=q;loading=true;failed=false;
  $("go").disabled=true;$("go").classList.add("busy");$("goTxt").textContent=T[lang].busy;
  const jobs=jobsFor(q),st={},ok={};
  jobs.forEach(([s])=>{st[s]="load";ok[s]=0});drawStatus(st);render();
  const res=await Promise.all(jobs.map(async([s,fn])=>{
    try{const r=await fn();ok[s]++;return r}catch(e){return[]}
  }));
  Object.keys(st).forEach(s=>st[s]=ok[s]?"ok":"err");drawStatus(st);
  // merge, dedupe by url, interleave so all sources appear near the top
  const by={hn:[],gh:[],dev:[]},seen=new Map();
  res.flat().forEach(i=>{if(!(i.ts>=cutoff()))return;const k=i.url.replace(/\/$/,"");
    if(seen.has(k)){const o=seen.get(k);o.cats=uniq([...o.cats,...i.cats]);return}
    seen.set(k,i);by[i.src].push(i)});
  const out=[],max=Math.max(...Object.values(by).map(a=>a.length));
  for(let n=0;n<max;n++)["hn","dev","gh"].forEach(s=>{if(by[s][n])out.push(by[s][n])});
  items=out;when=Date.now();failed=!out.length;loading=false;
  $("go").disabled=false;$("go").classList.remove("busy");$("goTxt").textContent=T[lang].find;
  render();
}

/* ---------- rendering ---------- */
function drawStatus(st){
  $("status").innerHTML=Object.keys(st).map(k=>`<span class="chip ${st[k]}"><i></i>${SRC[k]}${st[k]=="err"?" · "+T[lang].fail:""}</span>`).join("");
}
function drawTabs(){
  const t=T[lang];
  $("tabs").innerHTML=Object.keys(t.cats).map(k=>{
    const n=k=="all"?items.length:items.filter(i=>i.cats.includes(k)).length;
    return `<button data-c="${k}" aria-pressed="${k==cat}" style="--tc:var(--c-${k},var(--accent))"><i></i>${t.cats[k]}${items.length?`<em>${n}</em>`:""}</button>`}).join("");
}
function render(){
  const t=T[lang];
  drawTabs();drawSort();
  $("title").textContent=lastQ?t.results(lastQ):t.latest;
  let rows=items.filter(i=>cat=="all"||i.cats.includes(cat));if(sort=="new")rows=[...rows].sort((a,b)=>b.ts-a.ts);view=rows;
  $("count").textContent=items.length?t.n(rows.length)+" · "+t.win+(when?" · "+t.updated+" "+new Date(when).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""):"";
  if(loading&&!items.length){$("list").innerHTML='<li class="sk"></li>'.repeat(5);return}
  if(failed){$("list").innerHTML=`<li class="msg"><strong>${t.errT}</strong>${t.errB}<br><button class="topic" onclick="find()">${t.retry}</button></li>`;return}
  if(!rows.length){$("list").innerHTML=`<li class="msg"><strong>${t.noT}</strong>${t.noB}</li>`;return}
  $("list").innerHTML=rows.map((i,n)=>{
    const tags=PRIORITY.filter(k=>i.cats.includes(k)).slice(0,2);
    return `<li class="card${n==0?" feat":""}" style="--s:var(--${i.src})">
      <div class="top">${tags.map(k=>`<span class="tag" style="--t:var(--c-${k})">${t.cats[k]}</span>`).join("")}<span class="src"><i></i>${SRC[i.src]}</span></div>
      <a class="title" href="${esc(i.url)}" data-n="${n}">${esc(i.title)}</a>
      ${i.desc?`<p>${esc(i.desc)}</p>`:""}
      <div class="meta">${i.stat.map(s=>`<span>${esc(s.replace(/\{(\w+)\}/g,(m,k)=>t[k]))}</span>`).join("")}<span>${ago(i.ts)}</span><span class="read">${t.read}</span></div></li>`}).join("");
}
function ui(){
  const t=T[lang];document.documentElement.lang=lang;
  $("h1").textContent=t.h1;$("sub").textContent=t.sub;$("q").placeholder=t.ph;
  if(!loading)$("goTxt").textContent=t.find;
  $("px").setAttribute("aria-label",t.close);
  $("topics").innerHTML=`<span class="lbl">${t.topics}</span>`+TOPICS.map(x=>`<button class="topic">${x}</button>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lang));
  document.querySelector('#modes [data-m=news]').textContent=t.nNews;document.querySelector('#modes [data-m=jobs]').textContent=t.nJobs;
  $("jh1").textContent=t.jh1;$("jsub").textContent=t.jsub;$("credit").textContent=t.credit;
  if(!jloading)$("jgoTxt").textContent=t.jfind;
  render();jrender();
}
function drawSort(){const t=T[lang];$("sort").innerHTML=[["new",t.newest],["pop",t.popular]].map(([k,l])=>`<button data-s="${k}" aria-pressed="${sort==k}">${l}</button>`).join("")}

/* ---------- in-site reader ---------- */
const panel=$("panel"),bgEls=()=>[...document.querySelectorAll("body>.wrap,body>.tabsbar,body>main")];
let lastFocus=null,token=0;
function frame(html){
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  const css=`body{margin:0 auto;padding:28px clamp(18px,5vw,48px) 70px;max-width:720px;background:${v("--surface")};color:${v("--ink")};font:18px/1.75 Georgia,ui-serif,serif;overflow-wrap:anywhere}
h1,h2,h3,h4{font-family:system-ui,sans-serif;line-height:1.25;letter-spacing:-.01em}h1{font-size:1.9rem;margin:0 0 .4em}
a{color:${v("--accent")}}img,video,iframe,svg{max-width:100%;height:auto}pre{overflow:auto;background:${v("--bg")};padding:14px;border-radius:10px;font-size:.85rem;line-height:1.5}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}blockquote{margin:1em 0;padding-left:16px;border-left:3px solid ${v("--line")};color:${v("--muted")}}
table{border-collapse:collapse;display:block;overflow:auto}td,th{border:1px solid ${v("--line")};padding:6px 10px}hr{border:0;border-top:1px solid ${v("--line")}}
.m{font:500 .9rem system-ui,sans-serif;color:${v("--muted")};margin:0 0 22px}`;
  return `<!doctype html><meta charset="utf-8"><base target="_blank"><style>${css}</style><body>${html}`;
}
async function content(i){
  if(i.kind==="job"){
    if(!i.html)throw new Error("no description");
    return `<h1>${esc(i.title)}</h1><p class="m">${esc(i.company)} · ${esc(i.loc||"Remote")}${i.salary?" · "+esc(i.salary):""}</p>`+i.html;
  }
  if(i.src==="dev"){
    const a=await getJSON("https://dev.to/api/articles/"+i.id);
    return `<h1>${esc(a.title)}</h1><p class="m">${esc(a.user&&a.user.name||"")} · ${esc(a.readable_publish_date||"")} · ${a.reading_time_minutes||1} min</p>`+(a.cover_image?`<img src="${esc(a.cover_image)}" alt="">`:"")+a.body_html;
  }
  if(i.src==="gh"){
    const r=await fetch("https://api.github.com/repos/"+i.title+"/readme",{headers:{Accept:"application/vnd.github.html+json"}});
    if(!r.ok)throw new Error(r.status);
    const d=new DOMParser().parseFromString(await r.text(),"text/html");
    const raw="https://raw.githubusercontent.com/"+i.title+"/HEAD/",blob="https://github.com/"+i.title+"/blob/HEAD/";
    const abs=u=>/^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(u),clean=u=>u.replace(/^\.?\//,"");
    d.querySelectorAll("img[src]").forEach(e=>{const u=e.getAttribute("src");if(!abs(u))e.setAttribute("src",raw+clean(u))});
    d.querySelectorAll("a[href]").forEach(e=>{const u=e.getAttribute("href");if(!abs(u))e.setAttribute("href",blob+clean(u))});
    return `<h1>${esc(i.title)}</h1><p class="m">${esc(i.desc)}</p>`+d.body.innerHTML;
  }
  if(!i.ext){
    const d=await getJSON("https://hn.algolia.com/api/v1/items/"+i.id);
    return `<h1>${esc(d.title)}</h1><p class="m">${esc(d.author||"")}</p>`+(d.text||"");
  }
  const j=await getJSON("https://r.jina.ai/"+i.ext),c=(j.data&&j.data.content)||"";
  if(c.length<300)throw new Error("empty");
  let host="";try{host=new URL(i.ext).hostname}catch(e){}
  return `<h1>${esc(j.data.title||i.title)}</h1><p class="m">${esc(host)}</p>`+(window.marked?marked.parse(c):"<p>"+esc(c).replace(/\n{2,}/g,"</p><p>")+"</p>");
}
async function openReader(i,opener){
  const t=T[lang],my=++token;lastFocus=opener;
  $("pt").textContent=i.title;$("po").href=i.url;$("po").textContent=(i.kind==="job"?t.apply:t.orig)+" ↗";
  $("pb").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  bgEls().forEach(e=>e.inert=true);panel.inert=false;document.body.classList.add("open");$("px").focus();
  try{
    const html=await content(i);if(my!==token)return;
    const f=document.createElement("iframe");f.sandbox="allow-popups allow-popups-to-escape-sandbox";f.title=i.title;f.srcdoc=frame(html);
    $("pb").replaceChildren(f);
  }catch(e){if(my===token)$("pb").innerHTML=`<div class="msg"><strong>${t.cantT}</strong>${t.cantB}</div>`}
}
function closeReader(){
  token++;document.body.classList.remove("open");panel.inert=true;$("pb").innerHTML="";
  bgEls().forEach(e=>e.inert=false);if(lastFocus)lastFocus.focus();
}
$("list").onclick=e=>{const a=e.target.closest("a.title");if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;e.preventDefault();openReader(view[+a.dataset.n],a)};
$("scrim").onclick=closeReader;$("px").onclick=closeReader;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("open"))closeReader()});
$("sort").onclick=e=>{const b=e.target.closest("button");if(b){sort=b.dataset.s;render()}};

/* ---------- jobs ---------- */
const JOB_DAYS=60;
const strip=h=>(h||"").replace(/<[^>]+>/g," ").replace(/&[a-z#0-9]+;/gi," ").replace(/\s+/g," ");
const SEN=/\b(senior|sr\.?|lead|staff|principal|head of|architect|manager|director|expert|mid[- ]?level|mid[- ]?senior|vp)\b/i;
const JUN=/\b(junior|jr\.?|entry[- ]level|graduate|trainee|intern(?:ship)?|apprentice|fresher|early[- ]career|beginner)\b/i;
const JUNDESC=/(entry[- ]level|\b[01]\s*(?:-|–|to)\s*[23]\+?\s*years?|junior (?:flutter|angular|mobile|front-?end|software|developer|engineer|dev)\b|new grad|recent graduate|fresh graduate)/i;
const MANYYRS=/\b(?:[4-9]|1\d)\+?\s*(?:\+\s*)?years/i;
function isWorld(loc){
  const l=(loc||"").toLowerCase().trim();
  return !l||/worldwide|anywhere|global|world|international|any country|all countries/.test(l)||l==="remote";
}
function job(o){
  const plain=strip(o.html),head=o.title+" "+(o.tags||"");
  const has=rx=>rx.test(head)||(plain.match(new RegExp(rx.source,"gi"))||[]).length>=3;
  const stacks=[];if(has(/flutter/i))stacks.push("flutter");if(has(/angular/i))stacks.push("angular");
  if(!stacks.length)return null;
  const lvl=o.level||"";let junior=false;
  if(SEN.test(o.title)&&!JUN.test(o.title))return null;
  if(JUN.test(o.title)||/junior|entry/i.test(lvl))junior=true;
  else if(!/senior|mid/i.test(lvl)&&JUNDESC.test(plain)&&!MANYYRS.test(plain))junior=true;
  if(!junior)return null;
  return {kind:"job",src:o.src,id:o.id,title:o.title,company:o.company||"",loc:o.loc||"",type:o.type||"",level:lvl,salary:o.salary||"",
    url:o.url,ts:o.ts,html:o.html||"",stacks,world:isWorld(o.loc)};
}
/* ---------- end jobs ---------- */
async function jget(url){      // direct first; public CORS proxy only as a fallback
  try{return await getJSON(url)}catch(e){
    const c=new AbortController(),id=setTimeout(()=>c.abort(),15000);
    try{const r=await fetch("https://api.allorigins.win/raw?url="+enc(url),{signal:c.signal});if(!r.ok)throw e;return await r.json()}
    finally{clearTimeout(id)}
  }
}
const remotive=async t=>((await jget("https://remotive.com/api/remote-jobs?limit=100&search="+enc(t))).jobs||[]).map(j=>job({
  src:"rm",id:j.id,title:j.title,company:j.company_name,loc:j.candidate_required_location,type:(j.job_type||"").replace(/_/g," "),salary:j.salary,
  url:j.url,ts:Date.parse(j.publication_date),html:j.description,tags:(j.tags||[]).join(" ")}));
const jobicy=async t=>((await jget("https://jobicy.com/api/v2/remote-jobs?count=50&tag="+enc(t))).jobs||[]).map(j=>job({
  src:"jb",id:j.id,title:j.jobTitle,company:j.companyName,loc:[].concat(j.jobGeo||[]).join(", "),type:[].concat(j.jobType||[]).join(", "),
  level:[].concat(j.jobLevel||[]).join(", "),salary:j.annualSalaryMin?`${j.salaryCurrency||""} ${j.annualSalaryMin}–${j.annualSalaryMax||""}`.trim():"",
  url:j.url,ts:Date.parse(j.pubDate),html:j.jobDescription||j.jobExcerpt||""}));
const remoteok=async t=>(await jget("https://remoteok.com/api?tag="+enc(t))).filter(j=>j&&j.id&&j.position).map(j=>job({
  src:"ro",id:j.id,title:j.position,company:j.company,loc:j.location,salary:j.salary_min?`$${(+j.salary_min).toLocaleString()}–${(+j.salary_max).toLocaleString()}`:"",
  url:j.url||j.apply_url,ts:j.epoch?j.epoch*1000:Date.parse(j.date),html:j.description,tags:(j.tags||[]).join(" ")}));

async function jfind(){
  if(jloading)return;
  const t=T[lang],b=$("jgo");jloading=true;jfailed=false;jloaded=true;
  b.disabled=true;b.classList.add("busy");$("jgoTxt").textContent=t.busy;
  const plan=[["rm",()=>remotive("flutter")],["rm",()=>remotive("angular")],["jb",()=>jobicy("flutter")],["jb",()=>jobicy("angular")],["ro",()=>remoteok("flutter")],["ro",()=>remoteok("angular")]];
  const st={},ok={};plan.forEach(([k])=>{st[k]="load";ok[k]=0});drawJStatus(st);jrender();
  const res=await Promise.all(plan.map(async([k,fn])=>{try{const r=await fn();ok[k]++;return r}catch(e){return[]}}));
  Object.keys(st).forEach(k=>st[k]=ok[k]?"ok":"err");drawJStatus(st);
  const seen=new Map(),min=Date.now()-JOB_DAYS*864e5;
  res.flat().forEach(j=>{if(!j||j.ts<min)return;const k=(j.title+"|"+j.company).toLowerCase();
    if(seen.has(k)){const o=seen.get(k);o.stacks=uniq([...o.stacks,...j.stacks]);return}seen.set(k,j)});
  jobs=[...seen.values()];jwhen=Date.now();
  jfailed=!Object.values(ok).some(n=>n);jloading=false;
  b.disabled=false;b.classList.remove("busy");$("jgoTxt").textContent=T[lang].jfind;
  jrender();
}
function drawJStatus(st){$("jstatus").innerHTML=Object.keys(st).map(k=>`<span class="chip ${st[k]}"><i></i>${JSRC[k]}${st[k]=="err"?" · "+T[lang].fail:""}</span>`).join("")}
function jrender(){
  const t=T[lang];
  $("jfilters").innerHTML=[["all",t.jall],["flutter","Flutter"],["angular","Angular"]].map(([k,l])=>`<button class="topic" data-k="${k}" aria-pressed="${jstack==k}">${l}</button>`).join("")+`<button class="topic" data-w="1" aria-pressed="${jworld}">${t.jworld}</button>`;
  $("jtitle").textContent=t.jlatest;
  const rows=jobs.filter(j=>(jstack=="all"||j.stacks.includes(jstack))&&(!jworld||j.world)).sort((a,b)=>(b.ts||0)-(a.ts||0));
  jview=rows;
  $("jcount").textContent=jloaded&&!jloading?t.jn(rows.length)+" · "+t.jwin+(jwhen?" · "+t.updated+" "+new Date(jwhen).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""):"";
  if(!jloaded){$("jlist").innerHTML="";return}
  if(jloading){$("jlist").innerHTML='<li class="sk"></li>'.repeat(4);return}
  if(jfailed){$("jlist").innerHTML=`<li class="msg"><strong>${t.jerrT}</strong>${t.errB}<br><button class="topic" onclick="jfind()">${t.retry}</button></li>`;return}
  if(!rows.length){$("jlist").innerHTML=`<li class="msg"><strong>${t.jnoT}</strong>${t.jnoB}</li>`;return}
  $("jlist").innerHTML=rows.map((j,n)=>{
    const meta=[j.type,j.level&&!/any/i.test(j.level)?j.level:"",j.salary].filter(Boolean);
    return `<li class="card" style="--s:var(--${j.src})">
      <div class="top">${j.stacks.map(k=>`<span class="tag" style="--t:var(--c-${k=="flutter"?"mobile":"apps"})">${k=="flutter"?"Flutter":"Angular"}</span>`).join("")}<span class="src"><i></i>${JSRC[j.src]}</span></div>
      <a class="title" href="${esc(j.url)}" data-n="${n}">${esc(j.title)}</a>
      <p><b>${esc(j.company)}</b>${j.loc?" · "+esc(j.loc):""}</p>
      <div class="meta">${meta.map(m=>`<span>${esc(m)}</span>`).join("")}${isNaN(j.ts)?"":`<span>${ago(j.ts)}</span>`}<span class="read">${j.html?t.read:t.apply}</span></div></li>`}).join("");
}
function setMode(m){
  mode=m;[["newsHero","news"],["newsTabs","news"],["newsMain","news"],["jobsView","jobs"]].forEach(([id,k])=>$(id).hidden=(k!==m));
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  scrollTo(0,0);if(m==="jobs"&&!jloaded)jfind();
}
$("modes").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)};
$("jgo").onclick=jfind;
$("jfilters").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.w)jworld=!jworld;else jstack=b.dataset.k;jrender()};
$("jlist").onclick=e=>{const a=e.target.closest("a.title");if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;e.preventDefault();openReader(jview[+a.dataset.n],a)};

$("go").onclick=find;
$("q").onkeydown=e=>{if(e.key==="Enter")find()};
$("topics").onclick=e=>{const b=e.target.closest(".topic");if(b){$("q").value=b.textContent;find()}};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
document.querySelector(".lang").onclick=e=>{const b=e.target.closest("button");if(b){lang=b.dataset.l;put("tf_lang",lang);ui()}};
ui();find();
</script>
